sylius_twig_hooks:
    hooks:
        # Audit log entry page
        'tmonier_audit_log.admin.audit_log_entry.show.content':
            sections:
                template: '@TmonierSyliusAuditLogPlugin/admin/audit_log_entry/show/sections.html.twig'
                priority: 0

        'tmonier_audit_log.admin.audit_log_entry.show.content.sections#left':
            details:
                template: '@TmonierSyliusAuditLogPlugin/admin/audit_log_entry/show/details.html.twig'
                priority: 0

        'tmonier_audit_log.admin.audit_log_entry.show.content.sections#right':
            changes:
                template: '@TmonierSyliusAuditLogPlugin/admin/audit_log_entry/show/changes.html.twig'
                priority: 0

        # "History" cards
        'sylius_admin.product.show.content.page_body':
            tmonier_audit_log_history:
                template: '@TmonierSyliusAuditLogPlugin/admin/history_card.html.twig'
                priority: -1000

        'sylius_admin.product.update.content':
            tmonier_audit_log_history:
                template: '@TmonierSyliusAuditLogPlugin/admin/history_card.html.twig'
                configuration:
                    container: true
                priority: -50

        'sylius_admin.promotion.update.content':
            tmonier_audit_log_history:
                template: '@TmonierSyliusAuditLogPlugin/admin/history_card.html.twig'
                configuration:
                    container: true
                priority: -50

        'sylius_admin.order.show.content.sections#left':
            tmonier_audit_log_history:
                template: '@TmonierSyliusAuditLogPlugin/admin/history_card.html.twig'
                priority: -1000

        'sylius_admin.customer.show.content.sections':
            tmonier_audit_log_history:
                template: '@TmonierSyliusAuditLogPlugin/admin/history_card.html.twig'
                priority: -1000
