imports:
    - { resource: "@TmonierSyliusAuditLogPlugin/config/config.yaml" }

twig:
    paths:
        '%kernel.project_dir%/../../../tests/TestApplication/templates': ~

# Remove if you do not need to extend entities
doctrine:
    orm:
        entity_managers:
            default:
                mappings:
                    TestApplication:
                        is_bundle: false
                        type: attribute
                        dir: '%kernel.project_dir%/../../../tests/TestApplication/src/Entity'
                        prefix: Tests\Tmonier\SyliusAuditLogPlugin

# Development helper: bin/console tmonier:audit-log:demo
services:
    Tests\Tmonier\SyliusAuditLogPlugin\Command\GenerateDemoAuditLogCommand:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $tokenStorage: '@security.token_storage'
            $requestStack: '@request_stack'
            $couponFactory: '@sylius.factory.promotion_coupon'
            $taxonFactory: '@sylius.factory.taxon'
        tags: ['console.command']
